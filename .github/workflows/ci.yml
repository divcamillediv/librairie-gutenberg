name: CI

on:
  push:
    branches: [main, "feature/**", backup-develop]
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    services:
      # Base de test pour tests/test_postgres.py (table temporaire, aucune donnée réelle).
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gutenberg
          POSTGRES_USER: gutenberg
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gutenberg -d gutenberg"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: ci-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Installer les dépendances
        run: pip install -r backend/requirements.txt
      - name: Lancer les tests
        run: python -m pytest -q

  frontend:
    name: Frontend (tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installer les dépendances
        run: npm ci
      - name: Lancer les tests
        run: npm test
      - name: Construire l'application
        run: npm run build
