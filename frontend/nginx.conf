server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Les appels /api sont relayés vers le conteneur FastAPI : le navigateur du
    # client ne parle qu'à une seule origine (pas de CORS, pas d'IP à configurer).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Application monopage : toute autre route renvoie index.html (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
